name: 125A AWE32 Engine Safety - Windows
on:
  push:
    branches:
      - develop/v0.1.0-upstream-audit
  workflow_dispatch:
permissions:
  contents: read
jobs:
  engine-safety:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure patched chip safety harness
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -D125A_BUILD_ENGINE_PROBES=ON
      - name: Build all native chip, SoundFont and Synth compile targets
        shell: pwsh
        run: cmake --build build --config Release --parallel 2
      - name: Run native safety and static source-contract tests
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload native timbre probe executable
        uses: actions/upload-artifact@v4
        with:
          name: 125A-EMU8000-Timbre-Probe-Standalone-Windows-x64
          path: build/src/engine/Release/awe32_sf2_timbre_probe.exe
          if-no-files-found: error
          retention-days: 7
