name: P138 same-runner P134 vs P137 128x30 ABBA audio realtime microbenchmark
on:
  push:
    branches: [audit/p138-p137-steady-abba-performance]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p138-steady-${{ github.ref }}
  cancel-in-progress: true
jobs:
  fx-full-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned Steinberg SDK
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.8.1_build_84 --recurse-submodules https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk
          if ($LASTEXITCODE -ne 0) { throw 'SDK clone failed' }
          $sha=(git -C external/vst3sdk rev-parse HEAD).Trim()
          if ($sha -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') { throw "Unexpected SDK: $sha" }
      - name: Fetch fixed, previously verified P134 V11 binary for exact A/B
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference='Stop'
          $old=Join-Path $env:RUNNER_TEMP 'p137-p134-original-v11'
          $head=(gh api repos/challanger2000/125A-AWE-Synthesizer/actions/runs/42221403709 --jq .head_sha).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -ne 'f4eb2a699122d70f3dd889fd747de20022064ab4') { throw "Incorrect historical P134 baseline source: $head" }
          gh run download 42221403709 -n P134-AWE-CC120-FX-RT-Windows-x64-VST3-PREVIEW -D $old
          if ($LASTEXITCODE -ne 0) { throw 'Verified P134 VST3 artifact unavailable' }
          $bins=@(Get-ChildItem $old -Recurse -File -Filter '125A_AWE_Synthesizer.vst3')
          if($bins.Count -ne 1) { throw "Expected one old P134 V11 binary, found $($bins.Count)" }
          "P137_P134_BASELINE=$($bins[0].FullName)" | Out-File $env:GITHUB_ENV -Append
          New-Item -ItemType Directory -Force qa | Out-Null
          "baseline_run=42221403709" | Set-Content qa/p134-a-b-provenance.txt
          "baseline_commit=$head" | Add-Content qa/p134-a-b-provenance.txt
          "baseline_binary_sha256=$((Get-FileHash $bins[0].FullName -Algorithm SHA256).Hash)" | Add-Content qa/p134-a-b-provenance.txt
      - name: Configure full production VST3 and engine tests
        shell: pwsh
        run: |
          cmake -S . -B build-p133 -G "Visual Studio 17 2022" -A x64 -D125A_BUILD_VST3=ON -D125A_BUILD_ENGINE_PROBES=ON -D125A_BUILD_EDITORHOST_TEST=ON -D125A_P134_AB=ON "-DP134_BASELINE_VST3=$env:P137_P134_BASELINE"
          if ($LASTEXITCODE -ne 0) { throw 'Configure failed' }
      - name: Build all tests and production VST3
        shell: pwsh
        run: |
          cmake --build build-p133 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Production Windows VST3 build failed' }
      - name: Run entire CTest suite incl bitexact V11 + 4800-block steady ABBA benchmark
        shell: pwsh
        timeout-minutes: 15
        run: |
          New-Item -ItemType Directory -Force qa | Out-Null
          ctest --test-dir build-p133 -C Release --output-on-failure --timeout 120 2>&1 |
            Tee-Object -FilePath qa/ctest.txt
          if ($LASTEXITCODE -ne 0) { throw 'Full CTest failed' }
          if(Test-Path build-p133/p134-ab/before-after-pcm.txt) {
            Copy-Item build-p133/p134-ab/before-after-pcm.txt qa/p137-p134-fx-pcm-comparison.txt
          } else { throw 'Actual P134 V11 versus P137 PCM comparison report missing' }
          if(-not (Test-Path build-p133/p138-evidence/p138-stable-abba-128x30.csv) -or
             -not (Test-Path build-p133/p138-evidence/p138-performance-summary.txt)) {
             throw 'Missing P138 128x30 exact A/B CPU time evidence'
          }
          Copy-Item build-p133/p138-evidence/p138-stable-abba-128x30.csv qa/p138-stable-abba-128x30.csv
          Copy-Item build-p133/p138-evidence/p138-performance-summary.txt qa/p138-performance-summary.txt
          Get-Content qa/p138-performance-summary.txt | Write-Host
          "candidate_git_sha=$env:GITHUB_SHA" | Add-Content qa/p134-a-b-provenance.txt
          $log=Get-Content qa/ctest.txt -Raw
          if ($log -notmatch '100% tests passed' -or
              $log -notmatch '125A_p133_fx_register_modes' -or
              $log -notmatch '125A_p134_cc120_physical_stop' -or
              $log -notmatch '125A_p134_p133_full_pcm_ab' -or
              $log -notmatch '125A_p138_box86_shadow_abba' -or
              $log -notmatch '125A_asset_state') {
              throw 'P133 required tests not evidenced'
          }
      - name: Validate actual AWE VST3 module with Steinberg validator
        shell: pwsh
        timeout-minutes: 5
        run: |
          $validator=(Get-ChildItem build-p133 -Filter validator.exe -File -Recurse |
            Where-Object {$_.FullName -match 'Release'} |
            Select-Object -First 1 -ExpandProperty FullName)
          $plugin=(Resolve-Path 'build-p133/VST3/Release/125A_AWE_Synthesizer.vst3').Path
          if (-not $validator) { throw 'No Steinberg validator executable' }
          & $validator -e $plugin 2>&1 | Tee-Object qa/validator.txt
          if ($LASTEXITCODE -ne 0) { throw 'Steinberg VST3 validator failed' }
          $text=Get-Content qa/validator.txt -Raw
          if ($text -notmatch 'Result: ([0-9]+) tests passed, 0 tests failed') {
            throw 'Steinberg validator did not report a complete success summary'
          }
          $passed=[int]$Matches[1]
          # SDK's 47 internal selftests run during the build; the actual
          # VST3 module validation typically exercises >500 concrete cases.
          if ($passed -lt 500) { throw "Incomplete VST3 module validation: $passed" }
          Write-Host "Steinberg VST3 module validation PASS $passed tests, 0 failed"
      - name: Exercise complete VST3 GUI in native EditorHost three times
        shell: pwsh
        timeout-minutes: 6
        run: |
          $editor=(Get-ChildItem build-p133 -Filter editorhost.exe -File -Recurse |
            Where-Object {$_.FullName -match 'Release'} |
            Select-Object -First 1 -ExpandProperty FullName)
          $plugin=(Resolve-Path 'build-p133/VST3/Release/125A_AWE_Synthesizer.vst3').Path
          if (-not $editor) { throw 'EditorHost missing' }
          for($i=1;$i -le 3;$i++) {
            python tools/p18_editorhost_smoke.py --editorhost "$editor" --plugin "$plugin" --output "qa/editor-$i"
            if($LASTEXITCODE -ne 0) { throw "EditorHost GUI smoke $i failed" }
          }
      - name: Package validated Windows x64 VST3 preview (NOT a release)
        uses: actions/upload-artifact@v4
        with:
          name: P138-Box86-ShadowDSP-Windows-x64-VST3-TEST-ONLY
          path: build-p133/VST3/Release/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve independent numerical evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P138-Box86-ShadowDSP-4800-ABBA-FX-V11-Regression
          path: qa/
          if-no-files-found: warn
          retention-days: 14
