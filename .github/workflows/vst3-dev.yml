name: 125A AWE VST3 Dev - Windows x64
on:
  push:
    branches: [develop/v0.1.0-upstream-audit]
    paths: ['src/vst3/**', 'tests/source_contracts.py', 'tests/sf2_audio_integration.cpp', '.github/workflows/vst3-dev.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vst3-dev:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve exact Steinberg SDK 3.8.1
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.8.1_build_84 --recurse-submodules https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk
          $hash = (git -C external/vst3sdk rev-parse HEAD).Trim()
          if ($hash -ne "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96") { throw "Unexpected SDK: $hash" }
      - name: Configure VS2022 x64
        shell: pwsh
        run: cmake -S . -B build-vst3 -G "Visual Studio 17 2022" -A x64 -D125A_BUILD_VST3=ON -D125A_BUILD_ENGINE_PROBES=ON
      - name: Compile developer VST3
        shell: pwsh
        run: cmake --build build-vst3 --config Release --target 125A_AWE_Synthesizer --parallel 2
      - name: Run engine and SF2 native tests
        shell: pwsh
        run: |
          cmake --build build-vst3 --config Release --parallel 2
          ctest --test-dir build-vst3 -C Release --output-on-failure
      - name: Export ROM-free developer VST3 bundle
        uses: actions/upload-artifact@v4
        with:
          name: 125A-AWE-Synthesizer-Windows-x64-DEV
          path: build-vst3/VST3/Release/125A_AWE_Synthesizer.vst3/
          if-no-files-found: error
          retention-days: 7
