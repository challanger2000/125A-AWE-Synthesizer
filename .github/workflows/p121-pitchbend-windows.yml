name: P122 - Bank reselect and pitchbend Windows regressions
on:
  push:
    branches: [fix/p121-pitchbend-automation, fix/p122-bank-dirty-audit]
    paths:
      - '.github/workflows/p121-pitchbend-windows.yml'
      - 'CMakeLists.txt'
      - 'src/vst3/**'
      - 'src/engine/**'
      - 'tests/asset_state.cpp'
      - 'tests/p128_*'
      - 'src/vst3/AssetConfig.h'
      - 'tests/p14_vstgui_contract.py'
      - '.github/workflows/p121-pitchbend-windows.yml'
      - 'tools/p18_editorhost_smoke.py'
      - 'tests/p116_master_volume.cpp'
      - 'tests/p117_direct_preset_selection.cpp'
      - 'tests/p117_synthgm_catalog.cpp'
      - 'tests/p118_soundfont_parser_bounds.cpp'
      - 'tests/p119_midi_live_state.cpp'
      - 'tests/p119_realtime_engine_exchange.cpp'
      - 'tests/p120_engine_retirement.cpp'
      - 'tests/p120_midi_automation.cpp'
      - 'tests/p120_win_ui_reentrancy.cpp'
      - 'tests/p120_vst3_program_host.cpp'
      - 'tests/p119_realtime_engine_exchange.cpp'
      - 'src/engine/CMakeLists.txt'
      - 'src/engine/SoundFont.cpp'
      - 'tests/p121_pitchbend_audio.cpp'
      - 'tests/p122_browser_bank_command.cpp'
      - 'tests/p122_vst3_bank_host.cpp'
      - 'src/engine/Emu8000Box.cpp'
      - 'src/engine/Synth.cpp'
      - 'src/engine/Synth.h'
  workflow_dispatch:
concurrency:
  group: p121-vst3-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  p117-vst3:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Fetch verified Steinberg SDK 3.8.1 and submodules
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.8.1_build_84 --recurse-submodules https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk
          $hash = (git -C external/vst3sdk rev-parse HEAD).Trim()
          if ($hash -ne "3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96") { throw "Unexpected Steinberg SDK: $hash" }
      - name: Configure full Windows 2022 x64 VST3 and EditorHost
        shell: pwsh
        run: |
          cmake -S . -B build-p121 -G "Visual Studio 17 2022" -A x64 -D125A_BUILD_VST3=ON -D125A_BUILD_ENGINE_PROBES=ON -D125A_BUILD_EDITORHOST_TEST=ON
          if ($LASTEXITCODE -ne 0) { throw "P121 configure failed" }
      - name: Build real VST3 and native regression targets
        shell: pwsh
        run: |
          cmake --build build-p121 --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw "P121 native/SDK build failed" }
      - name: Test state migration, master-gain smoothing and existing regressions
        shell: pwsh
        run: |
          ctest --test-dir build-p121 -C Release --output-on-failure --timeout 90
          if ($LASTEXITCODE -ne 0) { throw "P121 CTest failures" }
      # Keep concrete failing-test evidence visible even when full Actions
      # log download is unavailable. Never change the CTest outcome.
      - name: Report failed CTests as structured annotations
        if: failure()
        shell: pwsh
        run: |
          $log = 'build-p121/Testing/Temporary/LastTest.log'
          if (Test-Path $log) {
            $text = Get-Content -Raw $log
            $sections = [regex]::Split($text, '(?m)(?=^\d+/\d+ Testing:)')
            foreach ($section in $sections) {
              if ($section -match '(?m)^Test Failed\.') {
                $detail = $section
                if ($detail.Length -gt 12000) { $detail = $detail.Substring($detail.Length - 12000) }
                $escaped = $detail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
                Write-Output "::error title=Failed CTest details::$escaped"
              }
            }
          }
      - name: Normalize and validate VST3 metadata JSON
        shell: pwsh
        run: |
          $info = "build-p121/VST3/Release/125A_AWE_Synthesizer.vst3/Contents/Resources/moduleinfo.json"
          python tools/normalize_vst3_metadata.py $info
          if ($LASTEXITCODE -ne 0) { throw "P121 metadata normalization failed" }
          python -c "import json,sys; j=json.load(open(sys.argv[1],encoding='utf8')); assert j['Name']; print('P120 VST3 moduleinfo JSON valid')" $info
          if ($LASTEXITCODE -ne 0) { throw "P121 invalid moduleinfo" }
      - name: EditorHost full Win32 GUI smoke
        shell: pwsh
        timeout-minutes: 4
        run: |
          $editor = Get-ChildItem build-p121 -Filter editorhost.exe -Recurse |
            Where-Object { $_.FullName -match 'Release' } |
            Select-Object -First 1 -ExpandProperty FullName
          $plugin = (Resolve-Path "build-p121/VST3/Release/125A_AWE_Synthesizer.vst3").Path
          if (-not $editor) { throw "P121 EditorHost missing" }
          # P121 shutdown audit: repeat real Win32 GUI creation, interaction,
          # editor close and plugin teardown to detect intermittent failures.
          for ($attempt=1; $attempt -le 3; $attempt++) {
            Write-Host "P121 complete EditorHost smoke iteration $attempt/3"
            python tools/p18_editorhost_smoke.py --editorhost "$editor" --plugin "$plugin" --output "build-p121/p121-gui/run-$attempt"
            if ($LASTEXITCODE -ne 0) { throw "P121 EditorHost iteration $attempt failed" }
          }
      - name: Package P122 functional VST3 with verified bank reselect
        uses: actions/upload-artifact@v4
        with:
          name: 125A-P122-Windows-x64-VST3
          path: build-p121/VST3/Release/
          if-no-files-found: error
          retention-days: 7
      - name: Package P122 EditorHost GUI screenshot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 125A-P122-EditorHost-GUI-Smoke
          path: build-p121/p121-gui/
          if-no-files-found: warn
          retention-days: 7
