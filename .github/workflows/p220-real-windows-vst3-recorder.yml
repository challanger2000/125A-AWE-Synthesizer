name: P222 controlled FX factorial on real Windows VST3 and clipped-PCM fault detection
on:
  push:
    branches: [qa/p220-77-preset-original-sound-acceptance, qa/p222-controlled-fx-factorial]
    paths:
      - tests/p220_77_vst3_pcm_recorder.cpp
      - tools/P222-LOCAL-FX-AB.bat
      - tools/p222_analyze_fixed_fx_ab.py
      - tests/p128_processor.cmake
      - .github/workflows/p220-real-windows-vst3-recorder.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p220-vst3-recorder-${{ github.ref }}
  cancel-in-progress: true
jobs:
  real-exported-windows-vst3-synthetic-probe:
    runs-on: windows-2022
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - name: Fetch identical pinned Steinberg VST3 SDK as existing P178 Windows host
        shell: pwsh
        run: |
          git clone --depth 1 --branch v3.8.1_build_84 --recurse-submodules https://github.com/steinbergmedia/vst3sdk.git external/vst3sdk
          if ($LASTEXITCODE -ne 0) { throw 'Steinberg SDK clone failed' }
          if ((git -C external/vst3sdk rev-parse HEAD).Trim() -ne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') { throw 'Steinberg SDK hash mismatch' }
      - name: Configure existing 125A actual product VST3 and P220 host
        shell: pwsh
        run: |
          cmake -S . -B build-p220 -G 'Visual Studio 17 2022' -A x64 -D125A_BUILD_VST3=ON -D125A_BUILD_ENGINE_PROBES=ON -D125A_BUILD_EDITORHOST_TEST=OFF
          if ($LASTEXITCODE -ne 0) { throw 'CMake failed' }
      - name: Build real Windows exported product and independent host
        shell: pwsh
        run: |
          cmake --build build-p220 --config Release --parallel 3 --target awe32_p220_77_vst3_pcm_recorder
          if ($LASTEXITCODE -ne 0) { throw 'P220 Windows VST3 host failed to build' }
      - name: Run actual exported VST3 process callbacks and WAV writer on synthetic asset only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'build-p220/Release/awe32_p220_77_vst3_pcm_recorder.exe').Path
          $dll=(Get-ChildItem 'build-p220/VST3/Release/125A_AWE_Synthesizer.vst3' -Filter '*.vst3' -File -Recurse | Select-Object -First 1).FullName
          $assets=(Get-ChildItem $env:TEMP -Directory -Filter '125a-p128-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $dll -or -not $assets) { throw 'Real exported VST3 or P128 synthetic assets unavailable' }
          New-Item -ItemType Directory -Force 'qa/p220-synthetic' | Out-Null
          & $exe $dll (Join-Path $assets 'zero.rom') (Join-Path $assets 'bank.sf2') 'qa/p220-synthetic' probe 2>&1 | Tee-Object 'qa/p220-probe-output.txt'
          if ($LASTEXITCODE -ne 0) { throw 'Real exported VST3 PCM synthetic probe failed' }
          $text=(Get-Content 'qa/p220-probe-output.txt' -Raw)
          if ($text -notmatch 'P220_MODE=SYNTHETIC_PROBE_NOT_ORIGINAL_SF2 ACTUAL_VST3_AUDIO_PAIRS=2 ACTUAL_CREATIVE_DRIVER_RUN=NO') { throw 'Missing explicit original-driver NO status' }
          @('P000-DRY.wav','P000-MODFX.wav') | ForEach-Object {
            $wav=Join-Path 'qa/p220-synthetic' $_
            if (-not (Test-Path $wav) -or (Get-Item $wav).Length -ne (44+132300*4)) { throw "Missing/truncated real VST3 process output: $wav" }
          }
          Write-Output 'P220 SYNTHETIC-ONLY actual exported VST3 process output verified: 2 WAVs, NOT 77 original SoundFont acceptance'
      - name: P221 deliberate >0 dBFS mutation must preserve ORIGINAL float values beyond PCM16 full scale
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'build-p220/Release/awe32_p220_77_vst3_pcm_recorder.exe').Path
          $wav='qa/p221-synthetic-overrange-F32.wav'
          & $exe --self-test-overload $wav
          if ($LASTEXITCODE -ne 0) { throw 'P221 overrange negative mutation not detected' }
          $b=[System.IO.File]::ReadAllBytes((Resolve-Path $wav).Path)
          if ($b.Length -ne 60) { throw 'P221 forensic float WAV length wrong' }
          if ([BitConverter]::ToUInt16($b,20) -ne 3 -or [BitConverter]::ToUInt16($b,22) -ne 2) { throw 'P221 WAV not stereo IEEE-FLOAT' }
          $a=[BitConverter]::ToSingle($b,48)
          $c=[BitConverter]::ToSingle($b,52)
          if ($a -ne -1.25 -or $c -ne 1.75) { throw "P221 float waveform got normalized or clipped: $a / $c" }
          Remove-Item $wav -Force
          Write-Output 'P221 adversarial overrange PASS: -1.25 and +1.75 ORIGINAL VST3-sample amplitudes preserved, no false PCM16 PASS'
      - name: P222 controlled factorial experiment on exported VST3 (synthetic-only) and all 8 real F32 capture files
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $exe=(Resolve-Path 'build-p220/Release/awe32_p220_77_vst3_pcm_recorder.exe').Path
          $dll=(Get-ChildItem 'build-p220/VST3/Release/125A_AWE_Synthesizer.vst3' -Filter '*.vst3' -File -Recurse | Select-Object -First 1).FullName
          $assets=(Get-ChildItem $env:TEMP -Directory -Filter '125a-p128-*' | Sort-Object LastWriteTime -Descending | Select-Object -First 1).FullName
          if (-not $dll -or -not $assets) { throw 'Original exported VST3 or generated P128 synthetic assets missing' }
          New-Item -ItemType Directory -Force 'qa/p222-synthetic' | Out-Null
          $PSNativeCommandUseErrorActionPreference = $false
          & $exe $dll (Join-Path $assets 'zero.rom') (Join-Path $assets 'bank.sf2') 'qa/p222-synthetic' fx-factorial-probe 2>&1 |
            Tee-Object 'qa/p222-fx-matrix-synthetic-log.txt'
          $status=$LASTEXITCODE
          if ($status -ne 0 -and $status -ne 1) { throw 'P222 synthetic factorial crashed or argument invalid' }
          $txt=(Get-Content 'qa/p222-fx-matrix-synthetic-log.txt' -Raw)
          if ($txt -notmatch 'P222_FX_SUMMARY MODE=SYNTHETIC ATTEMPTED=8 FAIL=\d+ CREATIVE_DRIVER=NOT_RUN') {
            throw 'P222 8 synthetic cases missing or incorrectly labelled as original Creative'
          }
          $rows=@(Get-Content 'qa/p222-fx-matrix-synthetic-log.txt' | Where-Object { $_ -match '^P222_FX_CASE ' })
          if ($rows.Count -ne 8) { throw "P222 expected eight independent cases, got $($rows.Count)" }
          $labels=@('P000-N48V64-DRY','P000-N48V64-REVERB','P000-N48V64-CHORUS','P000-N48V64-BOTH',
                    'P000-N72V120-DRY','P000-N72V120-REVERB','P000-N72V120-CHORUS','P000-N72V120-BOTH')
          foreach ($i in 0..7) {
            $row=$rows[$i]
            if (-not $row.Contains($labels[$i]+' ') -or
                -not $row.Contains('CC1=96 CC7=100 CC11=127 CC91=48 CC93=32')) {
              throw "P222 note/velocity/CC varied unexpectedly at case $i"
            }
            $rev=if ($i%4 -eq 1 -or $i%4 -eq 3) {'10000'} else {'0'}
            $chor=if ($i%4 -ge 2) {'10000'} else {'0'}
            if (-not $row.Contains("gui_rev=$rev gui_chor=$chor ")) {
              throw "P222 FX factorial not independently controlled at case $i"
            }
            $wav=Join-Path 'qa/p222-synthetic' ($labels[$i]+'-ACTUAL-VST3-F32.wav')
            if (-not (Test-Path $wav) -or (Get-Item $wav).Length -ne (44+132300*8)) {
              throw "P222 missing exact 3-second original VST3 32bit float capture: $wav"
            }
          }
          $hashes=@($labels[4..7] | ForEach-Object {
            (Get-FileHash (Join-Path 'qa/p222-synthetic' ($_+'-ACTUAL-VST3-F32.wav')) -Algorithm SHA256).Hash
          })
          if (@($hashes | Select-Object -Unique).Count -le 1) {
            throw 'P222 genuine VST3 emitted identical samples for dry and all three FX combinations'
          }
          & $exe --self-test-positive-rail
          if ($LASTEXITCODE -ne 0) { throw 'P222 signed16 positive full-scale rail FALSE-PASS mutation' }
          Write-Output ("P222 real Windows VST3 controlled FX factorial: 8/8 actual process() F32 WAV outputs, independent on/off sends; " +
                        "clip cases are explicitly FAIL, not audio fidelity. ORIGINAL_CREATIVE_77_NOT_RUN")
      - name: P222 independent float-WAV factorial analyzer and wrong-controller / missing-bank mutations
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          python tools/p222_analyze_fixed_fx_ab.py --synthetic-probe --wav-dir 'qa/p222-synthetic' --log 'qa/p222-fx-matrix-synthetic-log.txt' --out 'qa/p222-fx-analyzer-synthetic-result.json'
          if ($LASTEXITCODE -ne 0) { throw 'P222 independent float audio result parser failed' }
          $result=Get-Content 'qa/p222-fx-analyzer-synthetic-result.json' -Raw | ConvertFrom-Json
          if ($result.cases_observed -ne 8 -or $result.factorial_4_way_groups.Count -ne 2 -or
              $result.original_creative_driver_capture -ne 'NOT RUN' -or
              $result.release -ne 'BLOCKED') {
            throw 'P222 false-green real-driver or incomplete synthetic stage'
          }
          $original=Get-Content 'qa/p222-fx-matrix-synthetic-log.txt' -Raw
          $mutated=[regex]::new('CC91=48').Replace($original,'CC91=49',1)
          $mutated | Set-Content 'qa/p222-tampered-controller.txt'
          $PSNativeCommandUseErrorActionPreference = $false
          python tools/p222_analyze_fixed_fx_ab.py --synthetic-probe --wav-dir 'qa/p222-synthetic' --log 'qa/p222-tampered-controller.txt' --out 'qa/p222-corrupt-controller-result.json' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'P222 false-green: changed CC91 input accepted as valid fixed MIDI A/B' }
          python tools/p222_analyze_fixed_fx_ab.py --wav-dir 'qa/p222-synthetic' --log 'qa/p222-fx-matrix-synthetic-log.txt' --out 'qa/p222-false-original-result.json' 2>$null
          if ($LASTEXITCODE -eq 0) { throw 'P222 false-green: synthetic controls passed as owner 77 SoundFont' }
          Remove-Item 'qa/p222-tampered-controller.txt' -Force
          Write-Output 'P222 analyzer accepted 8 real exported VST3 F32 cases, rejected tampered CC91 and false owner-bank provenance'
          # The last intentional negative mutation returns nonzero; after BOTH
          # negative checks have proved the rejection, explicitly normalize the
          # shell step exit code (do not mask an earlier failure/throw).
          exit 0
      - name: Remove synthetic test WAV data; publish only a test log
        if: always()
        shell: pwsh
        run: |
          if (Test-Path qa/p220-synthetic) { Remove-Item qa/p220-synthetic -Recurse -Force }
          if (Test-Path qa/p222-synthetic) { Remove-Item qa/p222-synthetic -Recurse -Force }
      - name: Package portable owner-only Windows VST3 77-trial BAT, recorder EXE and exact verified DLL
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $kit='qa/P220-LOCAL-77-WINDOWS-VST3'
          New-Item -ItemType Directory -Force $kit | Out-Null
          Copy-Item 'build-p220/VST3/Release/125A_AWE_Synthesizer.vst3' (Join-Path $kit '125A_AWE_Synthesizer.vst3') -Recurse
          Copy-Item 'build-p220/Release/awe32_p220_77_vst3_pcm_recorder.exe' (Join-Path $kit '125A-P220-VST3-Recorder.exe')
          Copy-Item 'tools/P220-LOCAL-77-VST3.bat' (Join-Path $kit 'P220-LOCAL-77-VST3.bat')
          Copy-Item 'tools/P221-LOCAL-P000-CLIP-DIAG.bat' (Join-Path $kit 'P221-LOCAL-P000-CLIP-DIAG.bat')
          Copy-Item 'tools/P222-LOCAL-FX-AB.bat' (Join-Path $kit 'P222-LOCAL-FX-AB.bat')
          Copy-Item 'tools/p220_create_real_vst3_receipts.py' (Join-Path $kit 'p220_create_real_vst3_receipts.py')
          Copy-Item 'tools/p220_77_preset_capture_plan.py' (Join-Path $kit 'p220_77_preset_capture_plan.py')
          Copy-Item 'tools/p80_full_sf2_inventory.py' (Join-Path $kit 'p80_full_sf2_inventory.py')
          Copy-Item 'tools/p222_analyze_fixed_fx_ab.py' (Join-Path $kit 'p222_analyze_fixed_fx_ab.py')
          @(
            "P220 PORTABLE PRIVATE VST3 WAV TEST KIT (NOT RELEASE)"
            "SOURCE_SHA=$env:GITHUB_SHA"
            "WIN64_EXPORT_VST3=REAL"
            "SYNTHETIC_PROBE=2/2 ACTUAL_EXPORTED_PROCESS_WAV"
            "OWNER_77_PRESETS=NOT_RUN"
            "ORIGINAL_CREATIVE_WIN95_77_CAPTURE=NOT_RUN"
            "PRIVATE_ROM_SF2_AUDIO_NOT_IN_ZIP=true"
            "STUDIO_ONE_ASIO=NOT_RUN"
            "PHYSICAL_CREATIVE_HARDWARE=NOT_RUN"
            "RELEASE=NO_GO"
            "ACTION=Run P220-LOCAL-77-VST3.bat, provide local ROM/SF2 paths; records 154 private WAVs; cannot prove original Creative sound without original captures"
            "P221=If P000-MODFX clips, optional P221-LOCAL-P000-CLIP-DIAG.bat captures only P000, preserving original host F32 WAV and exact peak; no original driver claim"
            "P222=Run P222-LOCAL-FX-AB.bat for 16 fixed-note-and-velocity factorial cases: P000/P021 x N48/V64,N72/V120 x dry,reverb,chorus,both. Original host float captured, no normalization. Only GUI FX sends change within each four-run group."
            "P222_ORIGINAL_CREATIVE_AUDIO=NOT_RUN; P222_PHYSICAL_AWE64=NOT_TESTED; P222_RELEASE=BLOCKED"
          ) | Set-Content (Join-Path $kit 'P220-START-HERE.txt')
          $module=(Get-ChildItem (Join-Path $kit '125A_AWE_Synthesizer.vst3') -Filter '*.vst3' -File -Recurse | Select-Object -First 1).FullName
          if (-not $module) { throw 'VST3 module missing from portable kit' }
          Get-FileHash @($module,(Join-Path $kit '125A-P220-VST3-Recorder.exe')) -Algorithm SHA256 |
            ForEach-Object { '{0}  {1}' -f $_.Hash,$_.Path } |
            Set-Content (Join-Path $kit 'SHA256SUMS.txt')
      - uses: actions/upload-artifact@v4
        with:
          name: P222-Portable-Windows-VST3-Controlled-FX-AB-Test-Kit-NO-PRIVATE-MEDIA
          path: qa/P220-LOCAL-77-WINDOWS-VST3/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P222-Windows-Actual-Exported-VST3-FX-Control-SYNTHETIC-ONLY
          path: |
            qa/p220-probe-output.txt
            qa/p222-fx-matrix-synthetic-log.txt
            qa/p222-fx-analyzer-synthetic-result.json
          if-no-files-found: warn
          retention-days: 7
