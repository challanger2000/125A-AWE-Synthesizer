name: P213 source-derived original Creative EG1 Sustain 42-case regression
on:
  push:
    branches: [research/p212-original-creative-sustain-28]
    paths:
      - .github/workflows/p213-original-creative-sustain-replay.yml
      - tools/p213_original_creative_sustain_replay.py
      - tests/fixtures/p213_p212_creative_sustain_locked.json
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-parity:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed x86 division and BOTH frozen original Creative measurement sets
        run: |
          python3 tools/p213_original_creative_sustain_replay.py \
            --p210 tests/fixtures/p211_p210_creative_sustain.json \
            --p212 tests/fixtures/p213_p212_creative_sustain_locked.json \
            --out p213-evidence/P213-original-Creative-42-source-derived-parity.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P213-SBAWE-VXD-Creative-Sustain-42-original-case-parity
          path: p213-evidence/*.json
          retention-days: 30
          if-no-files-found: error
