name: P187 corrected P186-aware ETW ASIO Windows BAT hardware diagnostic package
on:
  push:
    branches: [qa/p187-capture-diagnostics]
    paths: ['.github/workflows/p187-capture-windows.yml', 'tools/P187-ETW-ASIO.bat', 'docs/P187-CAPTURE-DIAGNOSTICS.md']
permissions:
  contents: read
  actions: read
  pull-requests: write
concurrency:
  group: p187-awe-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      TESTLAB_SHA: dfcb4527f1f46904c73c5f7f113b81c9c41ef70a
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: challanger2000/125A-Plugin-Test-Lab
          ref: dfcb4527f1f46904c73c5f7f113b81c9c41ef70a
          path: lab
      - name: Retrieve proven unchanged P178 AWE binary
        uses: actions/download-artifact@v4
        with:
          name: P178-Windows-PRIVATE-LOCAL-TEST-KIT
          run-id: 42496568131
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: p178-verified
      - name: Validate exact baseline source and original binary manifest
        shell: pwsh
        run: |
          if ((git -C lab rev-parse HEAD).Trim() -cne $env:TESTLAB_SHA) { throw 'Lab source pin mismatch' }
          $provenance=Get-Content p178-verified/PROVENANCE.txt -Raw
          if ($provenance -notmatch 'SOURCE_SHA=cff9d91cdec5aa2574d039b23660fae0589c6878') { throw 'Wrong AWE binary source' }
          $dll=@(Get-ChildItem p178-verified/125A_AWE_Synthesizer.vst3 -Recurse -File -Filter '*.vst3')
          if ($dll.Count -ne 1) { throw 'Ambiguous original AWE DLL' }
          $hash=(Get-FileHash $dll[0].FullName -Algorithm SHA256).Hash
          if ((Get-Content p178-verified/SHA256SUMS.txt -Raw) -notmatch [regex]::Escape($hash)) { throw 'P178 original DLL hash mismatch' }
          git clone --no-checkout https://github.com/audiosdk/asio.git lab/asio-sdk
          if ($LASTEXITCODE -ne 0) { throw 'ASIO clone failed' }
          git -C lab/asio-sdk checkout --detach 496a0765b8bb9c26f764f22f9a9712a937177db2
          if ($LASTEXITCODE -ne 0) { throw 'ASIO SDK mismatch' }
      - name: Assert absolutely unchanged AWE runtime and native ASIO decoder
        shell: pwsh
        run: |
          git diff --exit-code 3aaa2f736535dde3642ab7cea11d919059ff12bb -- src CMakeLists.txt
          if ($LASTEXITCODE -ne 0) { throw 'P187 must not change any AWE processing code' }
          git -C lab diff --exit-code 59762ae67a5878f4bade2e000672497acde4f763 -- src CMakeLists.txt
          if ($LASTEXITCODE -ne 0) { throw 'P187 must not change the native ETW/ASIO decoder without physical evidence' }
      - name: Compile the pinned universal native ETW and ASIO tools
        shell: pwsh
        run: |
          cmake -S lab -B build-p185 -G 'Visual Studio 17 2022' -A x64 "-DASIO_SDK_DIR=$env:GITHUB_WORKSPACE/lab/asio-sdk"
          if ($LASTEXITCODE -ne 0) { throw 'P185 configure failed' }
          if ((git -C build-p185/_deps/vst3sdk-src rev-parse HEAD).Trim() -cne '3cdf9ca5d1f5b1b21e0a86832aa4abe55607bd96') { throw 'VST3 SDK mismatch' }
          New-Item -ItemType Directory -Force evidence | Out-Null
          cmake --build build-p185 --config Release --parallel 4 --target TestLabETW TestLabPhysicalASIO QAASIOReferenceMidi QAASIOReferenceMidiBroken 2>&1 | Tee-Object evidence/build.txt
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/build.txt | Select-String 'error [A-Z]+[0-9]+' | Select-Object -First 10 | ForEach-Object { Write-Host "::error::$($_.Line)" }; throw 'P185 native build failed' }
      - name: Actual Windows native ETW controls plus independent adverse fixtures
        shell: powershell
        run: |
          try {
            & ./lab/tests/p185_windows.ps1 -Build build-p185 -Evidence evidence
            if ($LASTEXITCODE -ne 0) { throw 'Native controls failed' }
            & ./lab/tests/p185_adversarial.ps1 -Evidence evidence
            if (-not (Test-Path evidence/P185-ADVERSARIAL.json)) { throw 'Adversarial completion missing' }
            & ./lab/tests/p186_reporting.ps1 -Evidence evidence
            $diagnosticCases=Get-Content evidence/P186-REPORTING-TESTS.json -Raw | ConvertFrom-Json
            if ($diagnosticCases.Count -ne 42 -or @($diagnosticCases | Where-Object {$_.status -cne 'PASS' -or $_.hardware -cne 'NOT_RUN'}).Count) {
              throw 'P187 requires all 42 independent P186 reporting controls'
            }
            Write-Host 'P187: 42 P186 decoder/CSwitch/attempted-ASIO reporting regressions PASS'
          } catch { Write-Host "::error::P185_CONTROLS $($_.Exception.Message) $($_.ScriptStackTrace)"; throw }
      - name: Require the completed full unchanged-AWE regression on this exact commit
        id: regression
        uses: actions/github-script@v7
        with:
          script: |
            for(let attempt=0;attempt<40;attempt++) {
              const list=(await github.rest.actions.listWorkflowRuns({...context.repo,workflow_id:'p185-awe-regression.yml',head_sha:'37e6294672b13ae7064fb8f4f79633aec8cfffb3',per_page:10})).data.workflow_runs;
              const r=list.find(x=>x.head_sha==='37e6294672b13ae7064fb8f4f79633aec8cfffb3');
              if(r&&r.status==='completed') {
                const jobs=(await github.rest.actions.listJobsForWorkflowRun({...context.repo,run_id:r.id})).data.jobs;
                for(const job of jobs) core.notice(`P185_AWE_REGRESSION_JOB=${job.html_url} conclusion=${job.conclusion}`);
                if(r.conclusion!=='success') throw new Error(`Full regression: ${r.conclusion}`);
                core.setOutput('run_id',String(r.id));return;
              }
              await new Promise(resolve=>setTimeout(resolve,30000));
            }
            throw new Error('Full regression not completed; no package acceptance');
      - uses: actions/download-artifact@v4
        with:
          name: P185-AWE-Full-Windows-Evidence-A
          run-id: ${{ steps.regression.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: full-regression
      - name: Reconcile actual full-suite and validator counts
        shell: pwsh
        run: |
          $ctest=Get-Content full-regression/ctest.txt -Raw
          if ($ctest -notmatch '100% tests passed, 0 tests failed out of ([0-9]+)') { throw 'No full CTest success' }
          $count=[int]$Matches[1]
          if ($count -lt 63) { throw 'Incomplete CTest suite' }
          $validator=Get-Content full-regression/validator.txt -Raw
          if ($validator -notmatch 'Result: ([0-9]+) tests passed, 0 tests failed') { throw 'Incomplete validator evidence' }
          $validated=[int]$Matches[1]
          $gui=@(Get-ChildItem full-regression -Recurse -Filter result.json | Where-Object {$_.FullName -match 'editor-[123]'} | ForEach-Object {Get-Content $_.FullName -Raw | ConvertFrom-Json})
          if ($gui.Count -ne 3 -or @($gui | Where-Object {-not $_.passed}).Count) { throw 'Missing three actual EditorHost smokes' }
          @{awe_source='37e6294672b13ae7064fb8f4f79633aec8cfffb3';ctest_passed=$count;validator_passed=$validated;editor_smokes=3;physical_asio='NOT_RUN';release_approved=$false} | ConvertTo-Json | Set-Content evidence/P185-FULL-REGRESSION.json
          Write-Host "::notice::P185_AWE_FULL_REGRESSION ctest=$count validator=$validated editor_smokes=3 source=37e6294672b13ae7064fb8f4f79633aec8cfffb3"
      - name: Integrate unchanged AWE and test the actual extracted ZIP BAT
        shell: powershell
        run: |
          try {
            & ./lab/tools/p185/Build-P185-Package.ps1 -Build build-p185 -Destination package -TestlabSource $env:TESTLAB_SHA -AweSource cff9d91cdec5aa2574d039b23660fae0589c6878 -AweBundle p178-verified/125A_AWE_Synthesizer.vst3
            Copy-Item tools/P187-ETW-ASIO.bat package/P187-ETW-ASIO.bat
            Copy-Item docs/P187-CAPTURE-DIAGNOSTICS.md package/P187-LESEN.txt
            $manifest=Get-Content package/P185-PACKAGE.json -Raw | ConvertFrom-Json
            foreach ($name in @('P187-ETW-ASIO.bat','P187-LESEN.txt')) {
              $manifest.files | Add-Member -NotePropertyName $name -NotePropertyValue (Get-FileHash (Join-Path package $name)).Hash.ToLowerInvariant()
            }
            foreach ($name in @('P185-DIAGNOSTICS.ps1','P185-RUN.ps1','P185-ANALYZE.ps1')) {
              if (-not $manifest.files.PSObject.Properties[$name]) { throw "Missing fail-closed corrected diagnostic script: $name" }
            }
            $cases=Get-Content evidence/P186-REPORTING-TESTS.json -Raw | ConvertFrom-Json
            if ($cases.Count -ne 42) { throw 'P187 corrected reporting oracle count not 42' }
            $manifest | Add-Member -NotePropertyName awe_integration_source -NotePropertyValue $env:GITHUB_SHA
            # PS 5.1 emits a JSON array as one pipeline item; inspect the assigned array.
            $adversarial=Get-Content evidence/P185-ADVERSARIAL.json -Raw | ConvertFrom-Json
            if ($adversarial.Count -ne 36 -or @($adversarial | Where-Object {$_.status -cne 'PASS' -or $_.hardware -cne 'NOT_RUN'}).Count) { throw 'Adversarial evidence count/status mismatch' }
            @{
              schema='125a-p185-tested-windows-package-v1';testlab_source=$env:TESTLAB_SHA;awe_integration_source=$env:GITHUB_SHA;
              full_awe_regression=(Get-Content evidence/P185-FULL-REGRESSION.json -Raw | ConvertFrom-Json);
              native_controls=(Get-Content evidence/P185-WINDOWS-CONTROLS.json -Raw | ConvertFrom-Json);
              adversarial_cases=$adversarial.Count;p186_reporting_cases=$cases.Count;
              physical_p185='NOT_RUN';cause='INCONCLUSIVE';release_approved=$false
            } | ConvertTo-Json -Depth 10 | Set-Content package/P185-WINDOWS-QA.json -Encoding UTF8
            $manifest.files | Add-Member -NotePropertyName 'P185-WINDOWS-QA.json' -NotePropertyValue (Get-FileHash package/P185-WINDOWS-QA.json).Hash.ToLowerInvariant()
            $manifest | ConvertTo-Json -Depth 10 | Set-Content package/P185-PACKAGE.json -Encoding UTF8
            Compress-Archive -Path package/* -DestinationPath P187-AWE-Windows.zip
            Expand-Archive P187-AWE-Windows.zip 'P187 BAT path with spaces'
            $env:CI='true'
            & cmd.exe /d /c '"P187 BAT path with spaces\P187-ETW-ASIO.bat" -CheckOnly'
            if ($LASTEXITCODE -ne 0) { throw 'Packaged BAT CheckOnly failed' }
            & cmd.exe /d /c '"P187 BAT path with spaces\P187-ETW-ASIO.bat" -Cancel'
            if ($LASTEXITCODE -ne 2) { throw 'BAT lost cancel errorlevel' }
            $reports=@(Get-ChildItem 'P187 BAT path with spaces' -Recurse -Filter P185-ACCEPTANCE.json | ForEach-Object {Get-Content $_.FullName -Raw | ConvertFrom-Json})
            if ($reports.Count -ne 2 -or @($reports | Where-Object {$_.physical_asio -cne 'NOT_RUN' -or $_.release_approved}).Count) { throw 'False hardware certification' }
            Add-Content 'P187 BAT path with spaces/P185-ANALYZE.ps1' '# deliberate tamper'
            & cmd.exe /d /c '"P187 BAT path with spaces\P187-ETW-ASIO.bat" -CheckOnly'
            if ($LASTEXITCODE -ne 3) { throw 'BAT failed to reject actual tamper' }
            # Verify the archive contents including the actual unchanged AWE DLL.
            $original=(Get-ChildItem p178-verified/125A_AWE_Synthesizer.vst3 -Recurse -File -Filter '*.vst3').FullName
            $archived=(Get-ChildItem 'P187 BAT path with spaces/AWE-UNCHANGED.vst3' -Recurse -File -Filter '*.vst3').FullName
            if ((Get-FileHash $original).Hash -cne (Get-FileHash $archived).Hash) { throw 'AWE DLL changed during packaging' }
            $adverse=$adversarial.Count
            @{
              schema='125a-p185-ci-integration-v1';awe_integration=$env:GITHUB_SHA;testlab_source=$env:TESTLAB_SHA;
              awe_binary_source='cff9d91cdec5aa2574d039b23660fae0589c6878';awe_dll_sha256=(Get-FileHash $original).Hash.ToLowerInvariant();
              native_etw_controls='PASS';adversarial_cases=$adverse;zip_bat_checkonly='PASS';cancel='PASS';tamper='REJECTED';
              physical_p185='NOT_RUN';awe_realtime='NOT_RUN';cause='INCONCLUSIVE';release_approved=$false
            } | ConvertTo-Json | Set-Content evidence/P185-INTEGRATION-CI.json
            Write-Host "::notice::P187_AWE_PACKAGE_VERIFIED awe=$env:GITHUB_SHA lab=$env:TESTLAB_SHA adverse=$adverse p186_reporting=$($cases.Count) physical=NOT_RUN release=NO_GO"
            exit 0
          } catch { Write-Host "::error::P185_PACKAGE $($_.Exception.Message) $($_.ScriptStackTrace)"; throw }
      - uses: actions/upload-artifact@v4
        if: success()
        id: kit
        with:
          name: P187-ETW-ASIO-DIAGNOSTICS-CORRECTED
          path: package/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
      - name: Retrieve the exact uploaded user artifact for a service roundtrip
        uses: actions/download-artifact@v4
        with:
          name: P187-ETW-ASIO-DIAGNOSTICS-CORRECTED
          path: SERVICE roundtrip path with spaces
      - name: Validate the actual user-download contents through its BAT
        shell: powershell
        run: |
          $env:CI='true'
          & cmd.exe /d /c '"SERVICE roundtrip path with spaces\P187-ETW-ASIO.bat" -CheckOnly'
          if ($LASTEXITCODE -ne 0) { throw 'Actual GitHub artifact lost required files or hashes' }
          $r=@(Get-ChildItem 'SERVICE roundtrip path with spaces' -Recurse -Filter P185-ACCEPTANCE.json | ForEach-Object {Get-Content $_.FullName -Raw | ConvertFrom-Json})
          if ($r.Count -ne 1 -or $r[0].physical_asio -cne 'NOT_RUN' -or $r[0].release_approved) { throw 'Roundtrip fabricated hardware certification' }
          if (-not (Test-Path 'SERVICE roundtrip path with spaces/P185-DIAGNOSTICS.ps1') -or
              -not (Test-Path 'SERVICE roundtrip path with spaces/P187-ETW-ASIO.bat')) {
            throw 'P187 actual downloaded GitHub ZIP dropped corrected reporter or launcher'
          }
          @{artifact_service_roundtrip='PASS';awe_integration=$env:GITHUB_SHA;testlab_source=$env:TESTLAB_SHA;physical_asio='NOT_RUN';release_approved=$false} | ConvertTo-Json | Set-Content evidence/P185-ARTIFACT-ROUNDTRIP.json
          Write-Host "::notice::P187_USER_ARTIFACT_ROUNDTRIP=PASS ZIP=${{ steps.kit.outputs.artifact-url }}"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P187-AWE-Windows-QA-Evidence
          path: |
            evidence/*.json
            evidence/*.txt
            evidence/native-etw-local/*.json
            evidence/native-etw-local/*.csv
          if-no-files-found: warn
          retention-days: 30
