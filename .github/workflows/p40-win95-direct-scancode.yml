name: P40 QEMU guest-controlled Windows95 input
on:
  push:
    branches: [research/p40-win95-qemu-direct-guest-input]
    paths:
      - tools/p40_qemu_win95_guest_scancode.py
      - .github/workflows/p40-win95-direct-scancode.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-scancodes:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and 7zip
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq qemu-system-x86 p7zip-full
          python -m pip install --disable-pip-version-check pillow
      - name: Get ephemeral unmodified preinstalled Windows95 reference disk
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p40"
          curl --fail --location --retry 3 --max-time 240 --output "$RUNNER_TEMP/p40/win95.7z" 'https://www.rekoba.de/~cs/v86/win95/Windows95b_p9x-0.9.91_512MB.img.7z'
          7z x -y "-o$RUNNER_TEMP/p40" "$RUNNER_TEMP/p40/win95.7z" >/dev/null
          disk="$(find "$RUNNER_TEMP/p40" -name '*.img' -type f | head -1)"
          test -n "$disk"
          echo "P40_DISK=$disk" >> "$GITHUB_ENV"
      - name: Test real guest BIOS scancodes and Win95 shell
        run: python tools/p40_qemu_win95_guest_scancode.py --image "$P40_DISK" --out p40-results
      - name: Convert raw screenshot outputs to PNG
        if: always()
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          for file in Path('p40-results').glob('*.ppm'):
              im=Image.open(file).convert('RGB')
              im.save(file.with_suffix('.png'))
              file.unlink()
          PY
      - name: Upload only screenshots and text proof, never Microsoft OS
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P40-Win95-QEMU-real-guest-scancode-evidence
          path: |
            p40-results/*.png
            p40-results/*.json
            p40-results/*.log
          if-no-files-found: warn
          retention-days: 5
      - name: Delete the transient Windows installation
        if: always()
        run: rm -rf "$RUNNER_TEMP/p40"
