name: P85 native 86Box AWE64 Gold D4-size 28MiB SF2 stress
on:
  push:
    branches: [develop/p63-win95-original-driver-midi-bridge]
    paths:
      - src/engine/**
      - tests/sf2_audio_integration.cpp
      - tests/p90_sf2_driver_registers.cpp
      - tools/p86_generic_sf2_probe.cpp
      - CMakeLists.txt
      - .github/workflows/p85-native-sf2-d4-size.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d4-size-native-chip:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure original 125A native EMU8000 chip test (no external sample bank)
        run: |
          cmake -S . -B build-p85 -DCMAKE_BUILD_TYPE=Release \
            -D125A_BUILD_ENGINE_PROBES=ON -D125A_BUILD_OPL3_PROBES=OFF \
            -D125A_BUILD_VST3=OFF -D125A_BUILD_UPSTREAM_CLI=OFF
      - name: Build native SF2 into actual 86Box chip test
        run: cmake --build build-p85 --parallel 4 --target awe32_sf2_audio_integration_test awe32_p86_generic_sf2_probe awe32_p90_sf2_driver_registers_test
      - name: Run full native EMU8000 integration incl. 25,881,188-byte synthetic SF2
        run: ctest --test-dir build-p85 --output-on-failure -R '125A_(sf2_audio_integration|p90_sf2_driver_registers)'

      - name: Export native generic SF2 audition executable only (no user bank/audio/ROM)
        uses: actions/upload-artifact@v4
        with:
          name: P86-Native-Linux-x64-SF2-Audition-Tool
          path: build-p85/src/engine/awe32_p86_generic_sf2_probe
          if-no-files-found: error
          retention-days: 3
