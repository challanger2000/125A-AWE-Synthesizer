name: P85 native 86Box AWE64 Gold D4-size 28MiB SF2 stress
on:
  push:
    branches: [develop/p63-win95-original-driver-midi-bridge]
    paths:
      - src/engine/**
      - tests/sf2_audio_integration.cpp
      - CMakeLists.txt
      - .github/workflows/p85-native-sf2-d4-size.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  d4-size-native-chip:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Configure original 125A native EMU8000 chip test (no external sample bank)
        run: |
          cmake -S . -B build-p85 -DCMAKE_BUILD_TYPE=Release \
            -D125A_BUILD_ENGINE_PROBES=ON -D125A_BUILD_OPL3_PROBES=OFF \
            -D125A_BUILD_VST3=OFF -D125A_BUILD_UPSTREAM_CLI=OFF
      - name: Build native SF2 into actual 86Box chip test
        run: cmake --build build-p85 --parallel 4 --target awe32_sf2_audio_integration_test
      - name: Run full native EMU8000 integration incl. 25,881,188-byte synthetic SF2
        run: ctest --test-dir build-p85 --output-on-failure -R '^125A_sf2_audio_integration$'
