name: P47 original 86Box AWE32 ROMs and EMU8000 I/O smoke
on:
  push:
    branches: [research/p47-86box-emu8000-hardware-smoke]
    paths:
      - tools/p45_86box_emu8k_trace.py
      - tools/p47_86box_emu8k_smoke.py
      - .github/workflows/p47-86box-emu8k-hardware.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hardware-smoke:
    runs-on: ubuntu-26.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install official 86Box Linux SDL build dependencies
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            build-essential cmake ninja-build git xvfb xauth curl \
            libfreetype-dev libgles2-mesa-dev libsdl3-dev libpng-dev \
            libc6-dev librtmidi-dev libopenal-dev libslirp-dev \
            libfluidsynth-dev libvdeplug-dev libserialport-dev libzstd-dev
      - name: Fetch verified 86Box sources privately and add P45 trace hook
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p47"
          git clone --quiet --depth 1 https://github.com/86Box/86Box.git "$RUNNER_TEMP/p47/86Box"
          git -C "$RUNNER_TEMP/p47/86Box" rev-parse HEAD > p47-86box-source-sha.txt
          python tools/p45_86box_emu8k_trace.py \
            --source "$RUNNER_TEMP/p47/86Box/src/sound/snd_emu8k.c" \
            --out "$RUNNER_TEMP/p47/snd_emu8k-instrumented.c"
          cp "$RUNNER_TEMP/p47/snd_emu8k-instrumented.c" \
             "$RUNNER_TEMP/p47/86Box/src/sound/snd_emu8k.c"
      - name: Build 86Box with opt-in automation and trace logging
        shell: bash
        run: |
          set -euo pipefail
          cmake -S "$RUNNER_TEMP/p47/86Box" -B "$RUNNER_TEMP/p47/build" \
            -G Ninja -D CMAKE_BUILD_TYPE=Release -D QT=OFF \
            -D USE_SDL_SHADER=OFF -D AUTOMATION=ON \
            -D MUNT=OFF -D FLUIDSYNTH=OFF -D RTMIDI=OFF \
            -D SOUNDCANVAS=OFF -D DISCORD=OFF
          cmake --build "$RUNNER_TEMP/p47/build" --parallel 4
          find "$RUNNER_TEMP/p47/build" -maxdepth 5 -type f -name 86Box -executable
      - name: Download minimum 86Box ROMs to disposable private runner only
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/p47/roms"
          mkdir -p "$root/sound/creative" "$root/machines/p55t2p4"
          # ROMs are supplied by the official 86Box ROM project; never upload.
          curl -fLsS --retry 3 --max-time 120 \
            'https://raw.githubusercontent.com/86Box/roms/master/sound/creative/awe32.raw' \
            -o "$root/sound/creative/awe32.raw"
          curl -fLsS --retry 3 --max-time 120 \
            'https://raw.githubusercontent.com/86Box/roms/master/sound/creative/CT3980%20PnP.BIN' \
            -o "$root/sound/creative/CT3980 PnP.BIN"
          curl -fLsS --retry 3 --max-time 120 \
            'https://raw.githubusercontent.com/86Box/roms/master/machines/p55t2p4/0207_j2.bin' \
            -o "$root/machines/p55t2p4/0207_j2.bin"
          test "$(stat -c %s "$root/sound/creative/awe32.raw")" -eq 1048576
          test "$(stat -c %s "$root/sound/creative/CT3980 PnP.BIN")" -eq 512
          test "$(stat -c %s "$root/machines/p55t2p4/0207_j2.bin")" -eq 131072
      - name: Verify non-PnP EMU8000 port hook and AWE32 PnP card presence
        shell: bash
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp > "$RUNNER_TEMP/p47/xvfb.log" 2>&1 &
          export DISPLAY=:99 SDL_AUDIODRIVER=dummy
          sleep 2
          python tools/p47_86box_emu8k_smoke.py \
            --binary "$RUNNER_TEMP/p47/build/src/86Box" \
            --roms "$RUNNER_TEMP/p47/roms" --out "$RUNNER_TEMP/p47/results"
      - name: Retain only textual research report, no ROM, VM or binary data
        if: always()
        shell: bash
        run: |
          mkdir -p p47-evidence
          cp "$RUNNER_TEMP/p47/results/P47-report.json" p47-evidence/ 2>/dev/null || true
          cp "$RUNNER_TEMP/p47/results/sbawe32/86box.log" p47-evidence/nonpnp-86box.log 2>/dev/null || true
          cp "$RUNNER_TEMP/p47/results/sbawe32_pnp/86box.log" p47-evidence/pnp-86box.log 2>/dev/null || true
          cp p47-86box-source-sha.txt p47-evidence/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P47-86Box-EMU8000-text-evidence
          path: p47-evidence/*
          if-no-files-found: warn
          retention-days: 5
      - name: Delete ROMs and external 86Box checkout
        if: always()
        run: rm -rf "$RUNNER_TEMP/p47"
