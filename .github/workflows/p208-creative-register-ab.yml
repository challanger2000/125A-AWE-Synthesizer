name: P208 original Creative SF2 hold-sustain research A/B
on:
  push:
    branches: [research/p206-original-eg1-registers]
    paths:
      - 'src/engine/SoundFont.cpp'
      - 'src/engine/CMakeLists.txt'
      - 'tools/p208_*'
      - 'tests/fixtures/p208_*'
      - '.github/workflows/p208-creative-register-ab.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-only-genuine-creative-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned public SF2 and ephemeral ROM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/p208" p208-evidence
          curl -fLsS --retry 3 --max-time 90 \
            https://raw.githubusercontent.com/mrbumpy409/SoundFont-Spec-Test/67c0405ea9/sf_spec_test.sf2 \
            -o "$RUNNER_TEMP/p208/source.sf2"
          test "$(git hash-object "$RUNNER_TEMP/p208/source.sf2")" = 4768c4a0215abf49c7a2bb51ada5ba3494faa1c5
          curl -fLsS --retry 3 --max-time 90 \
            https://raw.githubusercontent.com/86Box/roms/master/sound/creative/awe32.raw \
            -o "$RUNNER_TEMP/p208/awe32.raw"
          test "$(stat -c %s "$RUNNER_TEMP/p208/awe32.raw")" = 1048576
      - name: Adversarial negative controls on genuine P207 original measurements
        run: |
          python3 -m py_compile tools/p208_creative_register_compare.py
          python3 tools/p208_creative_register_compare.py --self-test
      - name: Build original and candidate real 86Box-native chip separately
        shell: bash
        run: |
          set -euo pipefail
          for kind in baseline candidate; do
            value=OFF
            if [ "$kind" = candidate ]; then value=ON; fi
            cmake -S . -B "build-p208-$kind" -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -D125A_BUILD_ENGINE_PROBES=ON -D125A_BUILD_VST3=OFF \
              -D125A_BUILD_OPL3_PROBES=OFF -DAWE125_P208_SF2_HOLD_SUSTAIN="$value"
            cmake --build "build-p208-$kind" --parallel 4 \
              --target awe32_p86_generic_sf2_probe
          done
      - name: Exercise same original note59 velocity100 for two seconds through both chips
        shell: bash
        run: |
          set -euo pipefail
          for kind in baseline candidate; do
            mkdir -p "$RUNNER_TEMP/p208/$kind/trace" "$RUNNER_TEMP/p208/$kind/audio"
            "build-p208-$kind/src/engine/awe32_p86_generic_sf2_probe" \
              --rom "$RUNNER_TEMP/p208/awe32.raw" \
              --sf2 "$RUNNER_TEMP/p208/source.sf2" \
              --out "$RUNNER_TEMP/p208/$kind/audio" \
              --trace-dir "$RUNNER_TEMP/p208/$kind/trace" \
              --bank 0 --programs 0 --note 59 --velocity 100
            test -s "$RUNNER_TEMP/p208/$kind/trace/B0_P0_N59_native-port-write.trace"
          done
      - name: Compare real native driver I/O and prove EG1 attack audio unchanged
        shell: bash
        run: |
          set -euo pipefail
          old="$(find "$RUNNER_TEMP/p208/baseline/audio" -type f -name '*.wav' -print -quit)"
          new="$(find "$RUNNER_TEMP/p208/candidate/audio" -type f -name '*.wav' -print -quit)"
          test -s "$old" && test -s "$new"
          python3 tools/p208_creative_register_compare.py \
            --fixture tests/fixtures/p208_original_creative_note59_oracle.json \
            --baseline "$RUNNER_TEMP/p208/baseline/trace/B0_P0_N59_native-port-write.trace" \
            --candidate "$RUNNER_TEMP/p208/candidate/trace/B0_P0_N59_native-port-write.trace" \
            --baseline-pcm "$old" --candidate-pcm "$new" \
            --out p208-evidence/P208-original-creative-EG1-AB.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: P208-Original-Creative-Research-Only-Register-AB
          path: p208-evidence/*.json
          retention-days: 7
          if-no-files-found: warn
      - name: Remove original public SoundFont, ROM and WAV from runner
        if: always()
        run: rm -rf "$RUNNER_TEMP/p208"
